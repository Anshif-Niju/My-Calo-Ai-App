services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: mycalo_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - mycalo_network

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycalo_api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - mycalo_network

  # Frontend Next.js
  web:
    build:
      context: ./mycalo-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: mycalo_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - api
    networks:
      - mycalo_network

volumes:
  redis_data:

networks:
  mycalo_network:
    driver: bridge
